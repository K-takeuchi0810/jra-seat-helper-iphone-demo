<!doctype html><html lang="ja"><meta charset="utf-8"><title>席取りサポート・デモ</title>
<style>body{font:18px sans-serif;max-width:800px;margin:60px auto;background:#f3f5f8}li{background:white;padding:25px;margin:15px}button,label,select{font:inherit;margin:12px;padding:8px;cursor:pointer}.notice{background:#fff5cf;padding:20px}</style>
<h1>デモ開催・架空の競馬場</h1><p>これはローカルのテスト画面です。実際の予約・請求は発生しません。</p>

<section id="demoSearch">
 <a id="linkButtonRaceCource" class="on">開催競馬場</a>
 <select id="dropDownListPlace"><option value="">選択してください</option><option value="TKIJ">東京競馬場</option><option value="KYO">京都競馬場</option></select>
 <select id="dropDownListEventDate"><option value="">選択してください</option></select>
 <a id="Main_LinkButtonSearch">検索</a><span id="demoSearchResult"></span>
</section>
<script>
 const demoDates=Array.from({length:3},(_,i)=>{const d=new Date(Date.now()+(i+5)*86400000);return new Date(d.getTime()+9*3600000).toISOString().slice(0,10)});
 document.getElementById('dropDownListPlace').onchange=()=>{const e=document.getElementById('dropDownListEventDate');e.replaceChildren(new Option('選択してください',''),...demoDates.map(d=>new Option(d,d+'T00:00:00')));};
 document.getElementById('Main_LinkButtonSearch').onclick=()=>{const a=document.createElement('a');a.href='EventDetail.aspx?event=demo';a.textContent='申し込みへ';a.onclick=e=>{e.preventDefault();const course=document.getElementById('dropDownListPlace').selectedOptions[0].textContent,date=document.getElementById('dropDownListEventDate').value.slice(0,10);let h=document.getElementById('demoEventHeading');if(!h){h=document.createElement('h2');h.id='demoEventHeading';document.getElementById('seats').before(h);}h.textContent=course+' '+date.replace(/-/g,'/');location.hash=new URLSearchParams({course,date}).toString();document.getElementById('demoSearchResult').replaceChildren();};document.getElementById('demoSearchResult').replaceChildren(a);};

 document.addEventListener('DOMContentLoaded',()=>{const params=new URLSearchParams(location.hash.slice(1)),course=params.get('course'),date=params.get('date');if(!['東京競馬場','京都競馬場'].includes(course)||!demoDates.includes(date))return;const h=document.createElement('h2');h.id='demoEventHeading';h.textContent=course+' '+date.replace(/-/g,'/');document.getElementById('seats').before(h);});
</script>
<ul id="seats"><li id="row">A指定席<br>
<span id="Main_SeatListItemRepeater_SeatListItem_0_spnSeatStockSymbolClass_0" class="seat_vacant">空席あり</span>
<div id="Main_SeatListItemRepeater_SeatListItem_0_PnlAutoSelectButton_0"><label class="btn_01" onclick="document.getElementById('Main_SeatListItemRepeater_SeatListItem_0_ConfirmPopup_0_PopupPanel_0').style.display='block'">申し込み</label></div>
<div class="notice" id="Main_SeatListItemRepeater_SeatListItem_0_ConfirmPopup_0_PopupPanel_0" style="display:none">デモの注意事項です。<label><input type="checkbox" id="noticeCheck">注意事項を確認しました</label><button onclick="this.parentNode.style.display='none';document.getElementById('amounts').style.display='block'">次へ進む</button></div>
<div id="amounts" style="display:none"><select id="Main_SeatListItemRepeater_SeatListItem_0_AreaDropDownList_0"><option>指定しない</option><option>前列</option></select>
<button id="Main_SeatListItemRepeater_SeatListItem_0_SeatAmountRepeater_0_LinkButton_0" onclick="done()">1席</button>
<button id="Main_SeatListItemRepeater_SeatListItem_0_SeatAmountRepeater_1_LinkButton_1" onclick="done()">2席</button>
<button id="Main_SeatListItemRepeater_SeatListItem_0_SeatAmountRepeater_2_LinkButton_2" onclick="done()">3席</button>
<button id="Main_SeatListItemRepeater_SeatListItem_0_SeatAmountRepeater_3_LinkButton_3" onclick="done()">4席</button></div>
</li></ul><div id="result"></div>
<script>function done(){document.getElementById('seats').style.display='none';document.getElementById('result').innerHTML='<h2>購入内容の確認</h2><p>デモの取り置き画面です。</p><button id="purchase" onclick="document.body.dataset.purchased=\'yes\'">購入確定（デモ）</button>';document.body.dataset.reserved='yes'}</script></html>
